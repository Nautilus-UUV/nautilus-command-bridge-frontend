# mosquitto config for the Nautilus mission laptop.
#
# The browser publishes commands over WebSockets (9001); mqtt_bridge_node
# on the Pi (or, in sim, on this same machine) connects via plain TCP (1883).
# No auth -- trusted-LAN posture, matches the existing frontend_claude.md
# assumption. Revisit before any field deployment outside the tether.
#
# Bring up with:
#     mosquitto -c mosquitto/mosquitto.conf -v
# (the -v makes it log every publish/subscribe, which is useful during dev.)

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
